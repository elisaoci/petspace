name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend: линтер и тесты
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: petspace_test
          POSTGRES_USER: petspace
          POSTGRES_PASSWORD: petspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petspace -d petspace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://petspace:petspace@localhost:5432/petspace_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Установить зависимости
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Линтер
        working-directory: backend
        run: ruff check .
      - name: Тесты
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend: сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Установить зависимости
        working-directory: frontend
        run: npm ci
      - name: Типы и сборка
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker: сборка и запуск
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить конфигурацию compose
        run: docker compose config --quiet
      - name: Собрать образы
        run: |
          docker build -t petspace-backend:ci ./backend
          docker build -t petspace-frontend:ci ./frontend
      # Регрессия на два реальных бага: node_modules с macOS в образе (vite: Permission denied)
      # и WORKDIR /app, который конфликтовал с маршрутом SPA /app.
      - name: Поднять frontend и проверить маршруты
        run: |
          docker run -d --name petspace-frontend-ci -p 5173:5173 petspace-frontend:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:5173/ > /dev/null 2>&1; then break; fi
            sleep 2
          done
          for path in / /app /plus; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:5173${path}")
            echo "${path} -> ${code}"
            test "${code}" = "200" || { docker logs petspace-frontend-ci; exit 1; }
          done
      - name: Логи frontend при падении
        if: failure()
        run: docker logs petspace-frontend-ci || true
