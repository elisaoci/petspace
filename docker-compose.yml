services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: petspace
      POSTGRES_USER: petspace
      POSTGRES_PASSWORD: petspace
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petspace -d petspace"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://petspace:petspace@db:5432/petspace
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      UPLOAD_DIR: /app/uploads
      # Локальная разработка: код входа возвращается в ответе, чтобы демо работало без почты.
      EXPOSE_DEV_OTP: ${EXPOSE_DEV_OTP:-false}
    ports:
      - "8000:8000"
    volumes:
      # Код монтируется из репозитория: правки применяются перезапуском контейнера,
      # пересобирать образ нужно только при изменении зависимостей.
      - ./backend:/app
      # Фото питомцев и вложения: без volume файлы теряются при пересоздании контейнера.
      - uploads_data:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app"

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
      # Docker Desktop не всегда доставляет события файловой системы из bind-mount,
      # поэтому dev-сервер опрашивает изменения.
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/usr/src/app
      # node_modules остаются из образа: они собраны под Linux, хостовые не подходят.
      - /usr/src/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
