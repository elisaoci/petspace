# PetSpace: входной шлюз (Nginx) с ограничением частоты запросов.
#
# Схема: интернет → nginx (TLS) → frontend:5173 (SPA) и backend:8000 (API).
# Контейнеры слушают внутреннюю сеть compose, наружу смотрит только шлюз.
#
# Ограничения частоты:
#   api  — общий лимит на IP, защищает от всплесков;
#   auth — строгий лимит на авторизацию: перебор паролей и кодов входа.
# Приложение дополнительно ограничивает OTP и вход на уровне БД, это второй слой.

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

upstream petspace_backend {
    server backend:8000;
    keepalive 32;
}

upstream petspace_frontend {
    server frontend:5173;
    keepalive 8;
}

server {
    listen 80;
    server_name _;
    # Всё по HTTPS, кроме проверки сертификата.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name petspace.example;   # заменить на боевой домен

    ssl_certificate     /etc/letsencrypt/live/petspace.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/petspace.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 12m;   # фото питомцев

    # Строгий лимит на авторизацию: коды входа, пароли, сброс.
    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://petspace_backend;
        include /etc/nginx/proxy_params;
    }

    # Стриминг ответа ИИ (SSE): буферизацию выключаем, иначе ответ идёт рывками.
    location = /api/v1/chat/stream {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://petspace_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://petspace_backend;
        include /etc/nginx/proxy_params;
    }

    location /uploads/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://petspace_backend;
        include /etc/nginx/proxy_params;
        expires 1h;
    }

    location / {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://petspace_frontend;
        include /etc/nginx/proxy_params;
    }
}
